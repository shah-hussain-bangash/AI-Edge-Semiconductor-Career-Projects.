# EA-28 laboratory-only container; bind broker to local loopback.
services:
  broker:
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1:8883:8883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./acl:/mosquitto/config/acl:ro
      - ./generated:/mosquitto/generated:ro
    restart: "no"
