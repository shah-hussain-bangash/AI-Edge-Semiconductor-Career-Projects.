name: EDGEOPS Windows SQLite Regression

on:
  push:
    branches: [dashboard-live-edit]
    paths:
      - "projects/industrial-edge-ai-predictive-maintenance/dashboard/**"
      - ".github/workflows/edgeops-windows-db-check.yml"
  pull_request:
    paths:
      - "projects/industrial-edge-ai-predictive-maintenance/dashboard/**"
      - ".github/workflows/edgeops-windows-db-check.yml"

permissions:
  contents: read

jobs:
  windows-sqlite:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: projects/industrial-edge-ai-predictive-maintenance/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install API dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify SQLite tests and Windows temporary-directory cleanup
        run: python -W default -m unittest discover -s tests -p test_server.py -v
