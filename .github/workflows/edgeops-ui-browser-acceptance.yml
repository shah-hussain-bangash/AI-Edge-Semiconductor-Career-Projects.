name: EDGEOPS UI Browser Acceptance

on:
  push:
    branches: [dashboard-live-edit]
    paths:
      - "projects/industrial-edge-ai-predictive-maintenance/dashboard/**"
      - ".github/workflows/edgeops-ui-browser-acceptance.yml"
  pull_request:
    paths:
      - "projects/industrial-edge-ai-predictive-maintenance/dashboard/**"
      - ".github/workflows/edgeops-ui-browser-acceptance.yml"

permissions:
  contents: read

jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: projects/industrial-edge-ai-predictive-maintenance/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/industrial-edge-ai-predictive-maintenance/dashboard/requirements.txt
      - name: Install application and browser test dependencies
        run: |
          python -m pip install -r requirements.txt "playwright>=1.50,<2"
          python -m playwright install --with-deps chromium
      - name: Real Chromium navigation acceptance
        run: python -m unittest discover -s tests -p test_navigation_browser.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install saved comparison browser dependencies
        run: |
          python -m pip install -r requirements-ml.txt
          npm install --no-save --prefix .local/browser-tests playwright
          .local/browser-tests/node_modules/.bin/playwright install --with-deps chromium
      - name: Real saved comparison and review acceptance
        run: NODE_PATH="$PWD/.local/browser-tests/node_modules" node tests/browser_comparison_review.cjs
      - name: Responsive workspace and keyboard interaction acceptance
        run: NODE_PATH="$PWD/.local/browser-tests/node_modules" node tests/browser_workspace.cjs
      - name: Authenticated maintenance planning acceptance
        run: NODE_PATH="$PWD/.local/browser-tests/node_modules" node tests/browser_maintenance.cjs
      - name: Saved synthetic incident lifecycle acceptance
        run: NODE_PATH="$PWD/.local/browser-tests/node_modules" node tests/browser_incidents.cjs
      - name: Approved-plan maintenance documentation exercise acceptance
        run: NODE_PATH="$PWD/.local/browser-tests/node_modules" node tests/browser_exercises.cjs
      - name: Local administrator team management acceptance
        run: NODE_PATH="$PWD/.local/browser-tests/node_modules" node tests/browser_team.cjs
      - name: Complete production readiness register acceptance
        run: NODE_PATH="$PWD/.local/browser-tests/node_modules" node tests/browser_readiness.cjs
      - name: Upload desktop and mobile review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edgeops-ui-visual-review
          path: projects/industrial-edge-ai-predictive-maintenance/dashboard/.acceptance-captures/*.png
          if-no-files-found: warn
          retention-days: 14
